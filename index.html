<!-- Script Interaktif -->
    <script>
        function copyDana() {
            const text = document.getElementById('danaNumber').innerText;
            navigator.clipboard.writeText(text);
            const btnText = document.getElementById('copyText');
            btnText.innerText = 'Disalin!';
            setTimeout(() => { btnText.innerText = 'Salin'; }, 2000);
        }

        // Fungsi saat item diklik untuk memunculkan pop-up
        function selectItem(category, itemName, itemPrice) {
            document.getElementById('modalCategory').innerText = category;
            document.getElementById('modalItemName').innerText = itemName;
            document.getElementById('modalItemPrice').innerText = 'Rp ' + itemPrice;
            
            document.getElementById('inputCategory').value = category;
            document.getElementById('inputItemName').value = itemName;
            document.getElementById('inputItemPrice').value = 'Rp ' + itemPrice;
            
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        function bukaAdmin() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('formLoginAdmin').classList.remove('hidden');
            document.getElementById('panelAdmin').classList.add('hidden');
            document.getElementById('passAdmin').value = '';
        }

        function tutupAdmin() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function prosesLogin() {
            const pw = document.getElementById('passAdmin').value;
            if (pw === "maspay123") {
                document.getElementById('formLoginAdmin').classList.add('hidden');
                document.getElementById('panelAdmin').classList.remove('hidden');
            } else {
                alert('Password salah!');
            }
        }

        // Fungsi untuk mengirim data ke WhatsApp
        function sendToWhatsApp(e) {
            e.preventDefault();
            const category = document.getElementById('inputCategory').value;
            const itemName = document.getElementById('inputItemName').value;
            const itemPrice = document.getElementById('inputItemPrice').value;
            const userId = document.getElementById('userId').value;
            const userWa = document.getElementById('userWa').value;
            const payment = document.getElementById('paymentMethod').value;

            const adminPhone = '6287838871945';
            const message = `Halo Admin MASPAY Store, saya ingin melakukan pemesanan / pembayaran layanan Point Blank:\n\n` +
                            `📌 *Kategori:* ${category}\n` +
                            `🎁 *Paket / Item:* ${itemName}\n` +
                            `💰 *Total Harga:* ${itemPrice}\n` +
                            `👤 *ID / Nick Game:* ${userId}\n` +
                            `📱 *No WA Pemesan:* ${userWa}\n` +
                            `💳 *Metode Pembayaran:* ${payment}\n\n` +
                            `Mohon konfirmasi dan info tata cara pembayarannya ya kak, terimakasih!`;

            const encodedURL = `https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;
            window.open(encodedURL, '_blank');
            closeOrderModal();
        }
    </script>
